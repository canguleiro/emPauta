
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CrIArt — teste real IndexedDB</title>
</head>
<body>
  <h1>CrIArt — homologação IndexedDB/WebCrypto</h1>
  <pre id="result">RUNNING</pre>

  <script>
    const result = document.querySelector('#result');

    window.addEventListener('error', event => {
      result.textContent =
        'FAIL: erro de carregamento ou execução: ' +
        (event.message || event.error || 'Erro desconhecido');
      document.documentElement.dataset.testStatus = 'failed';
    });

    window.addEventListener('unhandledrejection', event => {
      result.textContent =
        'FAIL: promessa rejeitada: ' +
        (event.reason?.stack || event.reason || 'Erro desconhecido');
      document.documentElement.dataset.testStatus = 'failed';
    });
  </script>

  <script type="module" src="./indexeddb-vault.browser.js"></script>
</body>
</html>
