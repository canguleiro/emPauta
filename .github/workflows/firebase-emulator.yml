
name: Firebase Emulator Security Tests

on:
  pull_request:
  push:
    branches: [main, master, homologacao-4B24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js cryptography and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  firestore-rules:
    name: Firebase Emulator Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --global firebase-tools
      - run: npm run test:emulator

  browser-indexeddb:
    name: Browser IndexedDB and WebCrypto Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install stable Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Run browser tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:browser:indexeddb
