name: Firebase Emulator Security Tests

on:
  pull_request:
  push:
    branches: [main, master, homologacao-4B24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js cryptography and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete Node.js test suite
        run: npm test

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Run Firestore Emulator rules tests
        env:
          CI: true
        run: npm run test:emulator

  browser-indexeddb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run real IndexedDB and WebCrypto browser test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:browser:indexeddb
