<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Em Pauta - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --app-bg: #efeae2; --header-bg: #075e54; }
        body.dark { --app-bg: #0b141a; --header-bg: #202c33; background-color: #0b141a !important; }
        
        body { 
            background-color: #d1d7db; 
            font-family: 'Segoe UI', sans-serif; 
            transition: background 0.3s ease;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        
        .main-app-container { 
            width: 100%; max-width: 500px; height: 100vh; 
            background-color: var(--app-bg); position: relative; 
            box-shadow: 0 0 30px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; transition: background 0.3s ease; 
        }

        @media (min-width: 768px) { .main-app-container { height: 95vh; border-radius: 10px; } }

        .chat-area { 
            flex: 1; overflow-y: auto; scroll-behavior: smooth; 
            padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; 
            position: relative;
        }
        
        /* Balões de Mensagem */
        .bubble { 
            max-width: 85%; border-radius: 12px; position: relative; 
            animation: fadeIn 0.2s ease; cursor: pointer; padding: 8px 12px; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .my-msg { background-color: #dcf8c6; align-self: flex-end; border-top-right-radius: 2px; }
        .other-msg { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 2px; }
        body.dark .my-msg { background-color: #005c4b; color: #e9edef; }
        body.dark .other-msg { background-color: #202c33; color: #e9edef; }
        body.dark .text-gray-800, body.dark .text-gray-200 { color: #e9edef !important; }

        .reply-tag { 
            border-left: 4px solid #075e54; background: rgba(0,0,0,0.06); 
            padding: 6px; margin-bottom: 6px; font-size: 0.8rem; 
            color: #555; font-style: italic; border-radius: 4px; display: block;
        }
        body.dark .reply-tag { background: rgba(255,255,255,0.05); color: #a1a1a1; }
        
        #login-screen { 
            position: absolute; inset: 0; z-index: 100;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%); 
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            border-radius: inherit;
        }
        
        .hidden { display: none !important; }
        footer { background-color: #f0f0f0; border-top: 1px solid #e0e0e0; z-index: 10; }
        body.dark footer { background-color: #202c33; border-top: 1px solid #2f3b37; }
        body.dark textarea { background: #2a3942; color: white; }

        .msg-image { border-radius: 8px; max-width: 100%; margin-top: 5px; cursor: zoom-in; }
        
        /* Modo Pânico */
        #panic-screen { 
            position: absolute; inset: 0; z-index: 200; background: #fff; 
            display: flex; flex-direction: column; font-family: 'Consolas', 'Courier New', monospace; 
            border-radius: inherit; 
        }
        .notepad-header { background: #f0f0f0; padding: 2px 10px; font-size: 12px; border-bottom: 1px solid #ccc; color: #333; display: flex; gap: 15px; }

        /* Dropdown de Mensagem */
        .msg-menu-btn {
            position: absolute; top: 2px; right: 4px; 
            color: rgba(0,0,0,0.2); padding: 0 4px; 
            font-size: 9px; opacity: 0; z-index: 5;
        }
        .bubble:hover .msg-menu-btn { opacity: 1; }
        .msg-dropdown { 
            position: absolute; background: white; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); min-width: 140px; 
            z-index: 100; overflow: hidden; border: 1px solid #eee; top: 22px; 
        }
        .menu-right { right: 0; } .menu-left { left: 0; }
        body.dark .msg-dropdown { background: #233138; border-color: #3b4a54; }
        .msg-dropdown button { 
            width: 100%; text-align: left; padding: 10px 14px; 
            font-size: 12px; display: flex; align-items: center; 
            gap: 10px; color: #333; border: none; background: transparent; cursor: pointer; 
        }
        body.dark .msg-dropdown button { color: #e9edef; }
        .msg-dropdown button:hover { background: #f5f5f5; }
        body.dark .msg-dropdown button:hover { background: #182229; }

        .reaction-badge { 
            background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 10px; padding: 1px 6px; font-size: 11px; 
            display: flex; align-items: center; gap: 3px; 
        }
        .read-status { font-size: 10px; margin-left: 4px; }
        .read-status.read { color: #34b7f1; }
        
        #emoji-box { max-height: 200px; overflow-y: auto; border-top: 1px solid rgba(0,0,0,0.1); }
        #system-status { font-size: 10px; color: #b2d8d2; font-style: italic; margin-top: 2px; height: 12px; overflow: hidden; }
        
        .react-tray {
            display: flex; padding: 8px; gap: 10px;
            border-bottom: 1px solid #eee; justify-content: center;
        }
        body.dark .react-tray { border-color: #3b4a54; }
        .react-tray span { font-size: 18px; transition: transform 0.2s; cursor: pointer; }
        .react-tray span:hover { transform: scale(1.4); }
    </style>
</head>
<body>

    <div class="main-app-container">
        <!-- Interface de Segurança (Bloco de Notas) -->
        <div id="panic-screen" class="hidden">
            <div class="notepad-header">
                <span>Ficheiro</span><span>Editar</span><span>Formatar</span><span>Ver</span>
                <span onclick="togglePanicMode()" style="cursor: pointer; opacity: 0.5;"><i class="fas fa-cog"></i></span>
            </div>
            <textarea id="panic-textarea" class="flex-1 p-2 border-none outline-none resize-none font-mono" placeholder="Notas de sistema..."></textarea>
        </div>

        <!-- Ecrã de Entrada -->
        <div id="login-screen">
            <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-[340px] text-center">
                <h1 class="text-3xl font-bold text-teal-800 mb-1">Em Pauta</h1>
                <p class="text-gray-400 text-xs mb-6 uppercase tracking-widest">Acesso Restrito</p>
                <input type="password" id="pass-input" placeholder="Palavra-passe" class="w-full p-4 bg-gray-100 rounded-xl mb-4 text-center text-xl outline-none border border-transparent focus:border-teal-500">
                <input type="text" id="nick-input" placeholder="O seu apelido" class="w-full p-4 bg-gray-100 rounded-xl mb-6 text-center outline-none border border-transparent focus:border-teal-500">
                <button onclick="attemptLogin()" class="w-full bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 hover:bg-teal-800">ENTRAR NO CHAT</button>
                <p id="status-text" class="text-[10px] mt-4 text-gray-400 italic">A estabelecer ligação...</p>
            </div>
        </div>

        <!-- Interface de Chat -->
        <div id="chat-app" class="hidden flex flex-col h-full">
            <header id="app-header" class="bg-[#075e54] text-white p-4 flex flex-col shadow-lg shrink-0 transition-colors duration-300">
                <div class="flex justify-between items-center w-full">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-teal-600 rounded-full flex items-center justify-center shadow-inner"><i class="fas fa-paper-plane text-white text-sm"></i></div>
                        <div>
                            <h1 class="font-bold leading-none text-md">Em Pauta</h1>
                            <div id="system-status"></div>
                        </div>
                    </div>
                    <div class="flex gap-1">
                        <button id="notif-btn" onclick="requestNotificationPermission()" title="Ativar Notificações" class="p-2 hover:bg-black/10 rounded-full transition text-blue-300 relative"><i class="fas fa-bell"></i></button>
                        <button onclick="togglePanicMode()" title="Modo Segurança" class="p-2 hover:bg-black/10 rounded-full transition text-yellow-300"><i class="fas fa-shield-alt"></i></button>
                        <button onclick="toggleDarkMode()" id="dark-btn" class="p-2 hover:bg-black/10 rounded-full transition"><i class="fas fa-moon"></i></button>
                        <button onclick="toggleSearch()" class="p-2 hover:bg-black/10 rounded-full transition"><i class="fas fa-search"></i></button>
                        <button onclick="logout()" class="p-2 hover:bg-black/10 rounded-full transition text-red-300"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
                <div id="search-bar" class="hidden mt-3">
                    <input type="text" id="search-input" oninput="render()" placeholder="Pesquisar..." class="w-full p-2 rounded-lg bg-black/20 border-none outline-none text-sm placeholder:text-teal-200 text-white">
                </div>
            </header>

            <main id="chat-box" class="chat-area"></main>

            <footer class="shrink-0">
                <div id="reply-bar" class="hidden bg-gray-200 p-2 border-l-4 border-teal-700 mx-4 mt-2 rounded-lg flex justify-between items-center animate-pulse">
                    <div class="px-2 overflow-hidden"><p class="text-[9px] font-bold text-teal-700 uppercase">A responder a</p><p id="reply-preview-text" class="text-xs text-gray-600 truncate italic"></p></div>
                    <button onclick="cancelReply()" class="text-red-500 p-2">&times;</button>
                </div>

                <div class="p-3 flex items-end gap-2">
                    <div class="flex flex-col gap-2">
                        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileSelect(this)">
                        <button onclick="document.getElementById('file-input').click()" class="w-10 h-10 bg-white dark:bg-gray-800 text-teal-600 rounded-full shadow flex items-center justify-center hover:scale-105 transition"><i class="fas fa-paperclip text-lg"></i></button>
                    </div>
                    <div class="flex-1 bg-white dark:bg-gray-700 rounded-2xl shadow-sm p-1 flex flex-col border border-gray-200 dark:border-gray-600">
                        <textarea id="msg-input" placeholder="Mensagem" rows="1" class="w-full p-2 outline-none resize-none text-sm bg-transparent"></textarea>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="toggleEmojis()" class="w-10 h-10 bg-white dark:bg-gray-800 text-gray-400 rounded-full shadow flex items-center justify-center hover:text-teal-600 transition"><i class="far fa-smile text-xl"></i></button>
                        <button id="send-btn" onclick="doSendMessage()" class="w-12 h-12 bg-[#00a884] text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 hover:bg-[#008f72]"><i class="fas fa-paper-plane text-lg"></i></button>
                    </div>
                </div>
                <div id="emoji-box" class="hidden grid grid-cols-6 gap-2 pb-4 px-4 bg-gray-50 dark:bg-gray-900/50"></div>
            </footer>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASQkgnQkeKjXKrmT3yMV9zcUVxec3NvrA",
            authDomain: "em-pauta-d6e92.firebaseapp.com",
            projectId: "em-pauta-d6e92",
            storageBucket: "em-pauta-d6e92.firebasestorage.app",
            messagingSenderId: "94994518950",
            appId: "1:94994518950:web:e60bb5bc83558752f47567"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appIdSlug = "em-pauta-main"; 
        const MASTER_PASS = "2407";

        let myNick = localStorage.getItem('empauta_nick_vfinal') || "";
        let replyTarget = null;
        let allMessages = [];
        let filterIndex = 0;
        let lastRenderedHash = "";
        let typingTimeout = null;
        let alertInterval = null;
        const originalTitle = "Em Pauta - Pro";

        const notificationSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

        const emojiList = ["😊", "😂", "🤣", "😍", "😒", "😭", "😱", "😴", "🤮", "😎", "🤔", "🤨", "🙄", "🤫", "❤️", "🔥", "👍", "👎", "✅", "⚠️", "❌", "💯", "💡", "🔔"];

        // --- SISTEMA DE PRESENÇA E STATUS ---
        const updateMyStatus = async (isTyping = false) => {
            if (!auth.currentUser || !myNick) return;
            const statusRef = doc(db, 'artifacts', appIdSlug, 'public', 'data', 'status', auth.currentUser.uid);
            try {
                await setDoc(statusRef, {
                    nick: myNick,
                    lastActive: serverTimestamp(),
                    isTyping: isTyping
                }, { merge: true });
            } catch (e) { if (e.code !== 'permission-denied') console.error(e); }
        };

        const listenToOthersStatus = () => {
            if (!auth.currentUser) return;
            onSnapshot(collection(db, 'artifacts', appIdSlug, 'public', 'data', 'status'), (snap) => {
                let activeUsers = [];
                let typingUser = null;
                const now = Date.now();
                snap.forEach(d => {
                    const data = d.data();
                    if (d.id === auth.currentUser?.uid) return;
                    const lastActive = data.lastActive?.seconds * 1000 || 0;
                    if (now - lastActive < 60000) {
                        activeUsers.push(data.nick);
                        if (data.isTyping) typingUser = data.nick;
                    }
                });
                const statusEl = document.getElementById('system-status');
                if (statusEl) {
                    if (typingUser) { statusEl.innerText = `${typingUser} está a escrever...`; statusEl.style.color = "#2ecc71"; }
                    else if (activeUsers.length > 0) { statusEl.innerText = `${activeUsers.join(', ')} online`; statusEl.style.color = "#b2d8d2"; }
                    else { statusEl.innerText = ""; }
                }
            });
        };

        // Heartbeat
        setInterval(() => { if(auth.currentUser && myNick) updateMyStatus(false); }, 30000);

        // --- ALERTAS E NOTIFICAÇÕES PRIVADAS ---
        const triggerAlerts = (sender) => {
            if (!document.getElementById('panic-screen').classList.contains('hidden')) return;
            notificationSound.play().catch(() => {});
            
            if (document.hidden) {
                if (!alertInterval) {
                    alertInterval = setInterval(() => { document.title = document.title === originalTitle ? "🔴 NOVA MENSAGEM!" : originalTitle; }, 1000);
                }
                if (Notification.permission === "granted") {
                    new Notification("Em Pauta", { body: "Nova mensagem recebida", icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png", tag: "msg" });
                }
            }
        };

        window.addEventListener('focus', () => { 
            if (alertInterval) { clearInterval(alertInterval); alertInterval = null; document.title = originalTitle; }
            markRead(); 
        });

        // --- AÇÕES DE MENSAGEM ---
        window.toggleMsgMenu = (id) => {
            document.querySelectorAll('.msg-dropdown').forEach(m => m.id !== `menu-${id}` && m.classList.add('hidden'));
            document.getElementById(`menu-${id}`)?.classList.toggle('hidden');
            event.stopPropagation();
        };

        window.copyMsg = (text) => { navigator.clipboard?.writeText(text); alert("Copiado!"); };
        
        window.startReply = (id) => {
            const m = allMessages.find(msg => msg.id === id);
            if (!m) return;
            replyTarget = { sender: m.sender, text: m.text || "[Mídia]" };
            document.getElementById('reply-preview-text').innerText = `${m.sender}: ${replyTarget.text}`;
            document.getElementById('reply-bar')?.classList.remove('hidden');
            document.getElementById('msg-input')?.focus();
        };

        window.addReaction = async (id, emoji) => {
            const msg = allMessages.find(m => m.id === id);
            if (!msg) return;
            const reactions = msg.reactions || {};
            reactions[emoji] = (reactions[emoji] || 0) + 1;
            await updateDoc(doc(db, 'artifacts', appIdSlug, 'public', 'data', 'messages', id), { reactions });
        };

        window.editMsg = async (id, currentText) => {
            const newText = prompt("Editar mensagem:", currentText);
            if (newText && newText !== currentText) await updateDoc(doc(db, 'artifacts', appIdSlug, 'public', 'data', 'messages', id), { text: newText + " (editada)" });
        };

        window.deleteMsg = async (id) => { if(confirm("Apagar para todos?")) await deleteDoc(doc(db, 'artifacts', appIdSlug, 'public', 'data', 'messages', id)); };

        // --- APP CORE ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('status-text').innerText = "Ligação estável.";
                if (myNick) startChatSession();
            }
        });

        const initAuth = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
        initAuth();

        window.attemptLogin = async () => {
            const nick = document.getElementById('nick-input')?.value.trim();
            const pass = document.getElementById('pass-input')?.value;
            if (pass === MASTER_PASS && nick) {
                myNick = nick; localStorage.setItem('empauta_nick_vfinal', nick);
                if ("Notification" in window) Notification.requestPermission();
                startChatSession();
            } else { alert("Dados Inválidos."); }
        };

        const startChatSession = () => {
            if (!auth.currentUser) return;
            document.getElementById('login-screen')?.classList.add('hidden');
            document.getElementById('chat-app')?.classList.remove('hidden');
            updateMyStatus(false);
            listenToOthersStatus();
            startListening();
        };

        const startListening = () => {
            onSnapshot(collection(db, 'artifacts', appIdSlug, 'public', 'data', 'messages'), (snap) => {
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                const oldLen = allMessages.length;
                allMessages = list.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
                if (allMessages.length > oldLen && oldLen > 0 && allMessages[allMessages.length-1].sender !== myNick) triggerAlerts(allMessages[allMessages.length-1].sender);
                render();
                if(!document.hidden) markRead();
            });
        };

        const markRead = () => {
            if (!auth.currentUser) return;
            allMessages.forEach(m => {
                if (m.uid !== auth.currentUser.uid && (!m.seenBy || !m.seenBy.includes(auth.currentUser.uid))) {
                    updateDoc(doc(db, 'artifacts', appIdSlug, 'public', 'data', 'messages', m.id), { seenBy: arrayUnion(auth.currentUser.uid) }).catch(()=>{});
                }
            });
        };

        window.render = () => {
            const box = document.getElementById('chat-box');
            if (!box) return;
            const search = (document.getElementById('search-input')?.value || "").toLowerCase();
            const visible = allMessages.filter(m => (m.text||"").toLowerCase().includes(search) || m.sender.toLowerCase().includes(search));
            const hash = JSON.stringify(visible.map(m=>m.id+JSON.stringify(m.reactions)+m.seenBy?.length));
            if(hash === lastRenderedHash) return; lastRenderedHash = hash;

            box.innerHTML = "";
            visible.forEach(m => {
                const isMe = m.sender === myNick;
                const div = document.createElement('div');
                div.className = `bubble group ${isMe ? 'my-msg' : 'other-msg'}`;
                const reactions = m.reactions && Object.keys(m.reactions).length > 0 ? `<div class="reactions-container">${Object.entries(m.reactions).map(([e, c])=>`<span class="reaction-badge">${e} ${c}</span>`).join('')}</div>` : "";
                const status = isMe ? `<span class="read-status ${m.seenBy?.length?'read':'sent'}"><i class="fas ${m.seenBy?.length?'fa-check-double':'fa-check'}"></i></span>` : "";
                
                div.innerHTML = `
                    <button onclick="toggleMsgMenu('${m.id}')" class="msg-menu-btn"><i class="fas fa-chevron-down"></i></button>
                    <div id="menu-${m.id}" class="msg-dropdown hidden ${isMe?'menu-right':'menu-left'}">
                        <div class="react-tray"><span onclick="addReaction('${m.id}','❤️')">❤️</span><span onclick="addReaction('${m.id}','👍')">👍</span><span onclick="addReaction('${m.id}','🔥')">🔥</span></div>
                        <button onclick="startReply('${m.id}')"><i class="fas fa-reply"></i> Responder</button>
                        <button onclick="copyMsg('${m.text}')"><i class="fas fa-copy"></i> Copiar</button>
                        ${isMe ? `<button onclick="editMsg('${m.id}', '${m.text}')" class="text-blue-500"><i class="fas fa-edit"></i> Editar</button>` : ''}
                        <button onclick="deleteMsg('${m.id}')" class="text-red-500"><i class="fas fa-trash"></i> Excluir</button>
                    </div>
                    <div class="text-[9px] font-bold text-teal-800 dark:text-teal-400 uppercase mb-1 opacity-70 pr-4">${m.sender}</div>
                    ${m.reply ? `<div class="reply-tag">${m.reply}</div>` : ""}
                    ${m.fileData ? `<img src="${m.fileData}" class="msg-image" onclick="window.open(this.src)" />` : ""}
                    <div class="text-sm break-words whitespace-pre-wrap">${m.text || ""}</div>
                    ${reactions}
                    <div class="text-[8px] text-gray-400 text-right mt-1">${m.timestamp ? new Date(m.timestamp.seconds*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '...'} ${status}</div>
                `;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        };

        window.doSendMessage = async () => {
            const input = document.getElementById('msg-input');
            const file = window.selectedFile;
            if(!input?.value.trim() && !file) return;
            const payload = { sender: myNick, text: input.value.trim(), reply: replyTarget?`${replyTarget.sender}: ${replyTarget.text}`:null, fileData: file?.data||null, timestamp: serverTimestamp(), uid: auth.currentUser.uid, seenBy: [], reactions: {} };
            input.value = ""; window.selectedFile = null; document.getElementById('reply-bar')?.classList.add('hidden'); replyTarget = null;
            document.getElementById('send-btn').innerHTML = '<i class="fas fa-paper-plane text-lg"></i>';
            await addDoc(collection(db, 'artifacts', appIdSlug, 'public', 'data', 'messages'), payload);
            updateMyStatus(false);
        };

        document.getElementById('msg-input')?.addEventListener('input', () => {
            updateMyStatus(true); clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => updateMyStatus(false), 3000);
        });

        window.handleFileSelect = (input) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('send-btn').innerHTML = '<i class="fas fa-check text-green-400"></i>';
                window.selectedFile = { data: e.target.result };
            };
            reader.readAsDataURL(input.files[0]);
        };

        window.togglePanicMode = () => {
            const p = document.getElementById('panic-screen');
            if (p.classList.contains('hidden')) { p.classList.remove('hidden'); document.getElementById('panic-textarea').focus(); }
            else if (prompt("Segurança:") === MASTER_PASS) p.classList.add('hidden');
        };

        window.toggleDarkMode = () => { document.body.classList.toggle('dark'); localStorage.setItem('empauta_theme', document.body.classList.contains('dark')?'dark':'light'); };
        window.toggleSearch = () => document.getElementById('search-bar').classList.toggle('hidden');
        window.toggleEmojis = () => {
            const eb = document.getElementById('emoji-box'); eb.classList.toggle('hidden');
            if(!eb.classList.contains('hidden')) eb.innerHTML = emojiList.map(e=>`<button onclick="document.getElementById('msg-input').value+='${e}';document.getElementById('msg-input').focus();" class="text-2xl p-2">${e}</button>`).join('');
        };
        window.logout = () => { localStorage.removeItem('empauta_nick_vfinal'); location.reload(); };
        window.onclick = () => document.querySelectorAll('.msg-dropdown').forEach(m => m.classList.add('hidden'));
        document.getElementById('msg-input')?.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.doSendMessage(); } });
        if(localStorage.getItem('empauta_theme')==='dark') document.body.classList.add('dark');
    </script>
</body>
</html>
